# historical_f0.60: generated by sensitivity/admixture/make_configs.py from simulations/config/final_53g.yaml;
# identical except demography.admixture_fraction = 0.6, experiment.name and out_dir.
experiment:
  name: historical_f0.60
real_config: config/rw_hist_safe_53g.yaml
out_dir: sensitivity/admixture/results/historical_f0.60
sim:
  ms_bin: archie/ArchIE/msmodified/ms
  template: simulations/templates/rw_collapse_outgroup.tmpl
  nreps_train: 10000
  nreps_test: 1000
  seed: 1
  workers: 8
  N0: 60000
  mu: 4.0e-09
  recomb_rate: 8.0e-09
  theta_gamma_shape: 6
demography:
  admixture_fraction: 0.6
  Ne_rw_recent: 2000
  Ne_rw_hist: 15000
  Ne_rwextinct: 60
  Ne_coyote: 60000
  Ne_anc: 84000
  Ne_outgroup: 120000
  t_collapse: 100
  t_admix: 19
  t_rwextinct: 19
  t_rwmerge: 24
  t_rw_coyote: 18750
  t_outgroup: 50000
polarization:
  by_outgroup: true
features:
  drop_all_derived_bin: true
calibration:
  target_fpr:
  - 0.01
  - 0.02
  - 0.05
  include_inbetween: false
